services:
  app:
    build: .
    working_dir: /var/www
    volumes:
      - .:/var/www:z
    ports:
      - "1303:80"
    environment:
      JANATHAN_PORT: "1303"
      APP_BASE_PATH: ""
      DB_PATH: "database/janathan.sqlite"
      MIKROTIK_TIMEOUT: "5"
      MIKROTIK_SOCKET_TIMEOUT: "30"
      MIKROTIK_ATTEMPTS: "5"