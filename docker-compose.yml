version: '3.8'

services:
  app:
    build: .
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - MIKROTIK_TIMEOUT=${MIKROTIK_TIMEOUT}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - DB_PATH=${DB_PATH}
    ports:
      - "9000:9000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  database: